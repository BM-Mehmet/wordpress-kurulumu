version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: wordpress-db-nginx
    restart: always
    environment:
      # Lütfen buradaki parolaları kendi belirleyeceğiniz GÜÇLÜ parolalarla değiştirin
      MYSQL_ROOT_PASSWORD: NewRootPassword123!
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wpuser
      MYSQL_PASSWORD: NewWpUserPassword456!
    volumes:
      # Bu, veritabanı verilerini kalıcı olarak saklar
      - wordpress_db_data:/var/lib/mysql

  wordpress: # PHP-FPM servisi
    build: . # Aynı dizindeki Dockerfile'ı kullanacak
    container_name: wordpress-fpm
    restart: always
    environment:
      # Veritabanı hostu olarak sadece servis adını kullanıyoruz
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wpuser
      WORDPRESS_DB_PASSWORD: NewWpUserPassword456! # DB servisiyle AYNI olmalı
      WORDPRESS_TABLE_PREFIX: wps_ # Güvenlik için wp_ yerine farklı bir önek
    volumes:
      # WordPress dosyalarını web sunucusu (Nginx) ile paylaşmak için birim
      - wordpress_html:/var/www/html
    depends_on:
      - db # WordPress'in, DB'den sonra başlamasını sağlar

  nginx:
    image: nginx:stable-alpine
    container_name: wordpress-nginx
    restart: always
    ports:
      - "80:80" 
    volumes:
      - wordpress_html:/var/www/html # WordPress dosyalarına erişim
      - ./nginx.conf:/etc/nginx/conf.d/default.conf # Nginx yapılandırma dosyası
    depends_on:
      - wordpress # Nginx'in, WordPress'ten sonra başlamasını sağlar

volumes:
  # MySQL verileri için kalıcı birim
  wordpress_db_data:
  # WordPress dosyaları için paylaşılan birim
  wordpress_html:
