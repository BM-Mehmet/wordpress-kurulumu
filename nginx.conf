server {
    listen 80;
    
    # 🎯 1. DÜZELTME: index.php'yi index.html'den önce aramasını kesinleştirin.
    #    Eğer index.html problemi devam ediyorsa sadece 'index index.php;' kullanın.
    index index.php index.html index.htm; 
    
    root /var/www/html;
    
    # 2. İyileştirme: Karakter setini ve log formatını ayarlayın (isteğe bağlı).
    charset utf-8;
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # ----------------------------------------------------------------------
    # 🌐 KÖK DİZİN VE PERMALINKS (Kalıcı Bağlantılar)
    # ----------------------------------------------------------------------
    location / {
        # Eğer istenen dosya ($uri) veya klasör ($uri/) bulunamazsa,
        # isteği WordPress'in ana dosyası olan index.php'ye yönlendirir.
        try_files $uri $uri/ /index.php?$args;
    }

    # ----------------------------------------------------------------------
    # 🧠 PHP İŞLEME
    # ----------------------------------------------------------------------
    # Tüm .php uzantılı dosyalar için yapılandırma.
    location ~ \.php$ {
        # Sadece var olan dosyaları işlemek için ek bir güvenlik kontrolü.
        try_files $uri =404; 

        # PHP-FPM hizmetine yönlendirme
        fastcgi_pass wordpress:9000; 
        fastcgi_index index.php;
        
        # Standart FastCGI parametreleri
        include fastcgi_params;
        
        # PHP-FPM'in doğru dosyayı işlemesi için gerekli:
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # FastCGI'nin PATH_INFO'yu düzgün işlemesi için (isteğe bağlı, bazı eklentiler için faydalı):
        fastcgi_param PATH_INFO $fastcgi_path_info; 
    }

    # ----------------------------------------------------------------------
    # 🔒 GÜVENLİK
    # ----------------------------------------------------------------------
    # .htaccess ve diğer gizli dosyalara erişimi engeller.
    location ~ /\. {
        deny all;
    }
    
}