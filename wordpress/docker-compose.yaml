version: "3.8"
services:
  wordpress: 
    image: wordpress
    ports:
      - "80:80"
    volumes:
      - ./http:/var/www/html
    depends_on:
      - mysql
    environment:
      WORDPRESS_DB_HOST: mysql
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: "wdocker"
      WORDPRESS_DB_NAME: wordpress
    networks:
      dockernet:
        ipv4_address: "10.10.0.10"
  mysql:
    image: "mysql:5.7"
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_ROOT_PASSWORD: "wdocker"
    volumes:
      - ./mysql:/var/lib/mysql
    networks:
      dockernet:
        ipv4_address: "10.10.0.20"
networks: 
 dockernet:
   ipam:
     driver: default
     config:
       - subnet:  "10.10.0.0/24"


